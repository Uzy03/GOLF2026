[project]
name = "neurogolf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.1",
    "numpy>=2.2.2",
    "matplotlib>=3.10.0",
    "tqdm>=4.66.6",
    "kagglehub>=0.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxscript>=0.1.0",
    "kaggle>=1.6.0",
    "rich>=13.0.0",
]

[tool.uv]
package = false
dev-dependencies = ["pytest>=8.0.0"]

# Linux GPU server: use PyTorch's CUDA index (manylinux_2_17 compatible)
# Change cu121 to match your server's CUDA version (e.g. cu118, cu124)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

