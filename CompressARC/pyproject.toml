[project]
name = "neurogolf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.1",
    "numpy>=2.2.2",
    "matplotlib>=3.10.0",
    "tqdm>=4.66.6",
    "kagglehub>=0.2.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxscript>=0.1.0",
    "kaggle>=1.6.0",
    "rich>=13.0.0",
]

[tool.uv]
package = false
dev-dependencies = ["pytest>=8.0.0"]

# Linux server: CPU-only torch (driver 510 / CUDA 11.6 is too old for cu117+)
# To enable GPU, upgrade NVIDIA driver to 520+ (CUDA 11.8) then switch to cu118 index
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

